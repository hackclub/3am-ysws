<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3AM - Dashboard</title>
        <link rel="stylesheet" href="dashboard.css">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <a href="index.html" class="sidebar-logo">3AM</a>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item active">
                        <span class="nav-icon">home</span>
                    </a>
                    <a href="shop.html" class="nav-item">
                        <span class="nav-icon">shop</span>
                    </a>
                </nav>
                <div class="sidebar-owl">
                    <img src="assets/owl.png" alt="owl">
                    <p>keep building!</p>
                </div>
            </aside>

            <main class="main">
                <div class="topbar">
                    <h1 class="page-title">home</h1>
                    <div class="user-badge">@yourname</div>
                </div>

                <div class="cards">
                    <div class="card card-accent">
                        <span class="card-label">✦ hours coded</span>
                        <span class="card-value">24h</span>
                        <span class="card-sub">this week</span>
                    </div>
                    <div class="card">
                        <span class="card-label">✦ projects</span>
                        <span class="card-value">3</span>
                        <span class="card-sub">submitted</span>
                    </div>
                </div>

                <div class="section-box">
                    <span class="section-label">✦ your projects</span>
                    <div class="project-list">
                        <div class="project-item">
                            <span class="project-name">night-mode portfolio</span>
                            <span class="project-tag">reviewed ✓</span>
                        </div>
                        <div class="project-item">
                            <span class="project-name">night-mode portfolio</span>
                            <span class="project-tag">reviewed ✓</span>
                        </div>
                        <div class="project-item">
                            <span class="project-name">night-mode portfolio</span>
                            <span class="project-tag">in progress...</span>
                        </div>
                    </div>
                </div>
            </main>
    </body>
</html>
